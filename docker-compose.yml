services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aeolia
      POSTGRES_PASSWORD: aeolia_dev
      POSTGRES_DB: aeolia
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/aeolia_dev_password
    ports: ["7474:7474", "7687:7687"]
    volumes: ["graphdata:/data"]
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
volumes:
  pgdata:
  graphdata:
